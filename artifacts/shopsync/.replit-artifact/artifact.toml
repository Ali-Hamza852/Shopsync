kind = "web"
previewPath = "/"
title = "Shopsync"
version = "1.0.0"
id = "artifacts/shopsync"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25267

[services.development]
run = "pnpm --filter @workspace/shopsync run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shopsync", "run", "build" ]
publicDir = "artifacts/shopsync/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25267"
BASE_PATH = "/"
